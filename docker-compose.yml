services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # LLM local para clasificar nombres de capa que ningún keyword reconoce
  # (cada estudio nombra distinto: TUONG, S-COLS, A-MURO...). Corre en CPU a
  # propósito: NO reserva GPU, así nunca compite con el entrenamiento. La
  # clasificación es texto corto → unos segundos en CPU es de sobra.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    # /dev/shm más grande: PyTorch DataLoader con num_workers>0 pasa los batches
    # por memoria compartida. El default de Docker (64MB) tira "Bus error".
    shm_size: "2gb"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_HOST: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Worker de trabajos pesados (rq): parseo IFC, import vectorial de PDF,
  # detección ML, snapshots de training. Misma imagen y volúmenes que el
  # backend; consume de la cola "scalist-jobs" en Redis. Si este contenedor
  # no corre, la app degrada sola a ejecutar los jobs in-process (como antes).
  # OJO dev: no tiene hot-reload — tras cambiar código de servicios,
  # `docker compose restart worker`.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    shm_size: "2gb"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_HOST: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: rq worker scalist-jobs --url redis://redis:6379
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # El watcher de Next no detecta cambios en el bind mount de Windows ->
      # polling para que el hot-reload funcione sin reiniciar el contenedor.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
  ollama_data:
