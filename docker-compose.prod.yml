services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Para producción es importante deshabilitar hot reload y usar workers
      ENVIRONMENT: production
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Gunicorn para production con Uvicorn workers
    command: bash -c "alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    restart: always

  # Worker de trabajos pesados (rq): parseo IFC, detección ML, snapshots.
  # Misma imagen que el backend; consume la cola "scalist-jobs" en Redis.
  # Sin este servicio, enqueue() degrada a in-process dentro de Gunicorn
  # (OOM / API lenta / geometría IFC corrupta bajo presión de memoria).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ENVIRONMENT: production
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: rq worker scalist-jobs --url redis://redis:6379
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # Next inlinea NEXT_PUBLIC_* en el bundle al buildear: tienen que llegar
      # como build args (el env_file solo existe en runtime). Salen de .env.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_FEATURE_PRICE_INTELLIGENCE: ${NEXT_PUBLIC_FEATURE_PRICE_INTELLIGENCE:-false}
        NEXT_PUBLIC_FEATURE_COMPUTOS: ${NEXT_PUBLIC_FEATURE_COMPUTOS:-false}
        NEXT_PUBLIC_FEATURE_WIZARD_BUILDING: ${NEXT_PUBLIC_FEATURE_WIZARD_BUILDING:-false}
        NEXT_PUBLIC_FEATURE_LEGACY_BUDGET: ${NEXT_PUBLIC_FEATURE_LEGACY_BUDGET:-false}
        NEXT_PUBLIC_FEATURE_LANDING_PRICING: ${NEXT_PUBLIC_FEATURE_LANDING_PRICING:-false}
    env_file: .env
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
